# OpenEMR + MariaDB for the self-heal harness.
# Images pinned by tag AND digest: upstream rebuilds tags daily (see DECISIONS.md).
# This pair matches openemr/openemr docker/production/docker-compose.yml.
services:
  mysql:
    image: mariadb:12.3.3@sha256:2bdff1534a7e569fecaf4b10b66ad0d410806e382d9db29ba305448addda97c4
    command: ["mariadbd", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  openemr:
    image: openemr/openemr:8.4.1@sha256:f0bfbc17fae13503ab64bbd271f74d80dd4a0786f5a8d0683841aeef4e159700
    ports:
      - "${OPENEMR_HTTP_PORT:?set OPENEMR_HTTP_PORT in .env}:80"
      - "${OPENEMR_HTTPS_PORT:?set OPENEMR_HTTPS_PORT in .env}:443"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASS: ${MYSQL_PASS:?set MYSQL_PASS in .env}
      OE_USER: ${OE_USER:?set OE_USER in .env}
      OE_PASS: ${OE_PASS:?set OE_PASS in .env}
    volumes:
      - sites:/var/www/localhost/htdocs/openemr/sites
      - logs:/var/log
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # First boot runs the auto-installer, hence the long start_period.
      test: ["CMD", "curl", "-fsS", "http://localhost/meta/health/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10m

volumes:
  dbdata:
  sites:
  logs:
